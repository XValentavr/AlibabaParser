version: "3.5"

services:
  postgres:
    image: postgres:13-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    env_file:
      - ".env.docker"
    networks:
      - api-network

  redis:
    image: redis:latest
    restart: always
    container_name: gcs-api_redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./cache:/data
    networks:
      - api-network

  celery:
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    working_dir: /app/src
    command: bash -c "celery -A app.celery_app worker --autoscale=10,0 -l INFO  --concurrency=8 -O fair --pool=solo"
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file:
      - ".env"
    networks:
      - api-network

  flower:
    image: mher/flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379
      - FLOWER_PORT=5555
    ports:
      - 5555:5555
    depends_on:
      - redis
    networks:
      - api-network

  api:
    build: .
    command: bash -c "alembic upgrade head && python src/app.py run -h 0.0.0.0"
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    env_file:
      - ".env"
    depends_on:
      - postgres
      - selenium
    networks:
      - api-network

  selenium:
    image: selenium/standalone-chrome
    hostname: chrome
    privileged: true
    shm_size: 2g
    env_file:
      - ".env.selenium"
    ports:
      - "4444:4444"
    networks:
      - api-network
      
volumes:
  postgres_data:

networks:
  api-network:
    driver: bridge